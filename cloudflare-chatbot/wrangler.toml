name = "pixel-chatbot"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Secrets (set via CLI, never in this file):
#   npx wrangler secret put GEMINI_API_KEY

# Per-IP rate limit: 20 requests per 60 seconds (Workers Rate Limiting API).
# The worker fails open if this binding is unavailable.
[[unsafe.bindings]]
name = "CHAT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
# Optional resume context: set to the deployed PDF URL to attach it privately
# on the first message of each conversation.
# RESUME_PDF_URL = "https://divyam-n-portfolio.vercel.app/uploads/divyam_resume.pdf"

# For local development
[dev]
port = 3001
